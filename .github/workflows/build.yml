name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile, test and run the current checkpoint
        run: ./run.sh
